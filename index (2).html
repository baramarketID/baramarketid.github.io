<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style id="bm-style">/* Layout: one narrow column like a link-in-bio, ember glow behind the profile, flame-gradient promo card as the single loud element. */
:root{
  --bg:#F6F3F0;
  --surface:#FFFFFF;
  --ink:#2A2726;
  --muted:#6F6761;
  --line:#E6DFD8;
  --accent:#C9520A;
  --accent-soft:rgba(245,122,28,.12);
  --flame-a:#F57A1C;
  --flame-b:#EC3442;
  --on-flame:#FFFFFF;
  --glow:rgba(245,122,28,.20);
  --focus:#1F6FEB;
  --ok:#1E7F4F;
  --warn:#A3330B;
  --font-display:"Poppins",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-lg:20px;--r-md:14px;--r-sm:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151110;--surface:#211A18;--ink:#F5EFEB;--muted:#ADA39C;--line:#382E2A;
  --accent:#FF9B4A;--accent-soft:rgba(255,155,74,.14);--glow:rgba(245,122,28,.16);
  --focus:#7FB2FF;--ok:#5BD69A;--warn:#FF9B7A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151110;--surface:#211A18;--ink:#F5EFEB;--muted:#ADA39C;--line:#382E2A;
  --accent:#FF9B4A;--accent-soft:rgba(255,155,74,.14);--glow:rgba(245,122,28,.16);
  --focus:#7FB2FF;--ok:#5BD69A;--warn:#FF9B7A;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::after{content:"";position:fixed;inset:-20vh -20vw auto;height:70vh;pointer-events:none;z-index:0;
  background:radial-gradient(50% 55% at 50% 30%,var(--glow),transparent 70%)}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:6px}

.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:40px 120px;display:flex;flex-direction:column;gap:28px}

/* hero */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.avatar{width:104px;height:104px;border-radius:50%;padding:3px;background:conic-gradient(from 200deg,var(--flame-a),var(--flame-b),var(--flame-a))}
.avatar img{display:block;width:100%;height:100%;border-radius:50%;object-fit:contain;background:var(--surface);padding:14px}
.name{font-family:var(--font-display);font-weight:700;font-size:1.65rem;letter-spacing:-.01em;line-height:1.15;margin:6px 0 0;display:inline-flex;align-items:center;gap:6px;text-wrap:balance}
.name svg{width:20px;height:20px;flex:none;color:var(--accent)}
.tagline{margin:0;font-size:.72rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.bio{margin:4px 0 0;max-width:42ch;color:var(--ink);text-wrap:pretty}

.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chips li{font-size:.8rem;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}

/* promo */
.promo{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:22px 22px 20px;color:var(--on-flame);
  background:linear-gradient(135deg,var(--flame-a) 0%,var(--flame-b) 100%);display:flex;flex-direction:column;gap:8px;
  box-shadow:0 14px 36px -18px rgba(236,52,66,.65)}
.promo .mark{position:absolute;right:-28px;bottom:-34px;width:150px;height:150px;opacity:.18;pointer-events:none;filter:brightness(0) invert(1)}
.promo .eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.92;margin:0}
.promo h2{font-family:var(--font-display);font-weight:700;font-size:1.35rem;line-height:1.2;margin:0;max-width:22ch;text-wrap:balance}
.promo p{margin:0;max-width:40ch;opacity:.95;position:relative}
.promo .btn{align-self:flex-start;margin-top:8px;display:inline-flex;align-items:center;gap:8px;background:#FFFFFF;color:#2A2726;
  font-weight:700;font-size:.9rem;text-decoration:none;padding:10px 16px;border-radius:999px;position:relative}
.promo .btn svg{width:16px;height:16px}
.promo .btn:hover{transform:translateY(-1px)}

/* links */
.section-label{font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px 4px}
.links{display:flex;flex-direction:column;gap:10px}
.link{display:grid;grid-template-columns:44px minmax(0,1fr) 20px;align-items:center;gap:14px;text-decoration:none;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px 12px 12px;
  transition:transform .15s ease,border-color .15s ease}
.link:hover{transform:translateY(-1px);border-color:var(--accent)}
.link .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.link .ic svg{width:22px;height:22px}
.link .tx{min-width:0;display:flex;flex-direction:column}
.link .t{font-weight:700;font-size:.98rem;line-height:1.3;overflow-wrap:anywhere}
.link .s{font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link .go{width:18px;height:18px;color:var(--muted)}
.link.featured{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.link.featured .ic{background:linear-gradient(135deg,var(--flame-a),var(--flame-b));color:var(--on-flame)}
.link .badge{display:inline-block;margin-left:6px;vertical-align:2px;font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}

.pay{display:flex;flex-wrap:wrap;gap:8px}
.pay li{font-size:.8rem;font-weight:600;padding:6px 10px;border-radius:8px;border:1px dashed var(--line);color:var(--muted);background:transparent}
.pay{list-style:none;margin:0;padding:0}
.note{font-size:.8rem;color:var(--muted);margin:10px 0 0 4px}

.foot{text-align:center;font-size:.78rem;color:var(--muted)}

/* owner controls */
.fab{position:fixed;z-index:20;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;font:700 .9rem var(--font-body);
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;box-shadow:0 10px 30px -10px rgba(0,0,0,.45)}
.fab svg{width:18px;height:18px}
.banner{background:var(--surface);border:1px solid var(--accent);border-radius:var(--r-md);padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:.88rem}

/* editor */
.ed{display:flex;flex-direction:column;gap:18px}
.ed-head{display:flex;flex-direction:column;gap:4px}
.ed-head h1{font-family:var(--font-display);font-size:1.4rem;margin:0}
.ed-head p{margin:0;color:var(--muted);font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{font-family:var(--font-display);font-size:1rem;margin:0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:.78rem;font-weight:700;color:var(--muted)}
.field .hint{font-size:.75rem;color:var(--muted)}
input[type=text],input[type=url],textarea,select{width:100%;font:500 .92rem var(--font-body);color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px}
textarea{resize:vertical;min-height:72px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--focus);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:440px){.row2{grid-template-columns:1fr}}
.check{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;font-weight:600;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--flame-a)}
.logo-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo-row .avatar{width:72px;height:72px}
.logo-row .avatar img{padding:9px}

.le{border:1px solid var(--line);border-radius:var(--r-md);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.le-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.le-top .num{font-size:.75rem;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.tools{display:flex;gap:6px}
.ib{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.ib svg{width:16px;height:16px}
.ib:disabled{opacity:.35;cursor:default}
.ib.del{color:var(--warn)}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 .9rem var(--font-body);cursor:pointer;border-radius:999px;padding:11px 18px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn2 svg{width:16px;height:16px}
.btn2.primary{border:0;color:var(--on-flame);background:linear-gradient(135deg,var(--flame-a),var(--flame-b))}
.btn2:disabled{opacity:.6;cursor:default}
.add{border-style:dashed;width:100%}
.ed-bar{position:fixed;z-index:20;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ed-bar .in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ed-bar .status{flex:1 1 160px;font-size:.82rem;color:var(--muted);min-width:0}
.ed-bar .status.err{color:var(--warn)}
.ed-bar .status.ok{color:var(--ok)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}.link:hover,.promo .btn:hover{transform:none}}
.ed-bar .status:empty{display:none}.ed-bar .in{justify-content:flex-end}

/* ===== motion layer ===== */
:root{--title-a:#B8460A;--title-b:#D0283A;--spark:#FFC24B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--title-a:#FFB36B;--title-b:#FF6B6B}}
:root[data-theme="dark"]{--title-a:#FFB36B;--title-b:#FF6B6B}
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--ang:360deg}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.06)}}
@keyframes flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes shine{0%,55%{transform:translateX(-120%) skewX(-18deg)}100%{transform:translateX(220%) skewX(-18deg)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}70%,100%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}
@keyframes ticker{to{transform:translateX(-50%)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg) scale(1.1)}60%{transform:rotate(9deg) scale(1.1)}}
@keyframes drift{0%,100%{transform:translateX(-4%)}50%{transform:translateX(4%)}}

.embers{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
body::after{animation:drift 14s ease-in-out infinite}
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 70ms)}

.hero .avatar{width:128px;height:128px;padding:4px;position:relative;isolation:isolate;
  background:conic-gradient(from var(--ang),var(--flame-a),var(--flame-b),var(--spark),var(--flame-a));animation:spin 4s linear infinite}
.hero .avatar::before{content:"";position:absolute;inset:-22px;border-radius:50%;z-index:-1;
  background:radial-gradient(circle,rgba(245,122,28,.45) 0,rgba(236,52,66,.18) 45%,transparent 70%);animation:breathe 3.2s ease-in-out infinite}
.avatar.full img{padding:0;object-fit:cover}
.name .nm{background:linear-gradient(90deg,var(--title-a),var(--title-b),var(--title-a));background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 6s ease-in-out infinite}
.live{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;color:var(--ok);
  background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 10px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent);animation:blink 1.6s ease-in-out infinite}

.ticker{position:relative;overflow:hidden;border-block:1px solid var(--line);padding-block:12px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.ticker .track{display:flex;width:max-content;animation:ticker 22s linear infinite}
.ticker .track span{font-family:var(--font-display);font-weight:700;font-size:1rem;letter-spacing:.02em;white-space:nowrap;padding-inline:14px;color:var(--ink)}
.ticker .track b{color:var(--accent);font-weight:700;align-self:center}
.ticker:hover .track{animation-play-state:paused}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.promo{background:linear-gradient(120deg,var(--flame-a),var(--flame-b),#FF8A3D,var(--flame-a));background-size:300% 300%;animation:flow 9s ease infinite}
.promo.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both,flow 9s ease infinite;animation-delay:calc(var(--i,0) * 70ms),0s}
.promo::after{content:"";position:absolute;top:0;bottom:0;left:0;width:45%;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.32),transparent);animation:shine 5s ease-in-out infinite}
.promo .mark{animation:float 6s ease-in-out infinite}
.promo .btn{animation:ring 2.4s ease-out infinite;z-index:1}
.promo h2,.promo p,.promo .eyebrow{position:relative;z-index:1}

.link{position:relative;overflow:hidden}
.link::before{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--accent-soft),transparent);transform:skewX(-18deg);transition:left .6s ease}
.link:hover::before{left:130%}
.link:hover .ic svg{animation:wiggle .55s ease}
.link .go{transition:transform .2s ease,color .2s ease}
.link:hover .go{transform:translate(3px,-3px);color:var(--accent)}
.link:active{transform:scale(.985)}
.link.featured{border:1.5px solid transparent;box-shadow:0 8px 24px -16px rgba(236,52,66,.6);
  background:linear-gradient(var(--surface),var(--surface)) padding-box,
  conic-gradient(from var(--ang),var(--flame-a),var(--flame-b),var(--spark),var(--flame-a)) border-box}
.link.featured.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both,spin 4s linear infinite;animation-delay:calc(var(--i,0) * 70ms),0s}
.link.featured .badge{background:linear-gradient(90deg,var(--flame-a),var(--flame-b));color:var(--on-flame);padding:2px 6px;border-radius:5px;animation:blink 1.8s ease-in-out infinite}
.pay li{transition:transform .2s ease,border-color .2s ease,color .2s ease}
.pay li:hover{transform:translateY(-2px);border-color:var(--accent);color:var(--ink)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important}
  .embers{display:none}
  .ticker .track{flex-wrap:wrap;width:auto;justify-content:center}
  .ticker .track .dup{display:none}
}
</style>
</head>

function move(i,dir){var a=draft.links,j=i+dir;if(j<0||j>=a.length)return;var t=a[i];a[i]=a[j];a[j]=t;touch();render();}
function loadLogo(file){
  var r=new FileReader();
  var animated=/gif|webp|apng/i.test(file.type);
  if(animated&&file.size>4*1024*1024){setStatus("GIF-nya terlalu besar ("+(file.size/1048576).toFixed(1)+" MB). Kecilkan dulu sampai di bawah 4 MB, misalnya di ezgif.com.","err");return;}
  r.onload=function(){
    if(animated){draft.profile.logo=r.result;touch();render();setStatus("Logo animasi dipasang.","ok");return;}
    var img=new Image();
    img.onload=function(){
      var S=256,c=document.createElement("canvas");c.width=S;c.height=S;var g=c.getContext("2d");
      var k=Math.min(S/img.width,S/img.height),w=img.width*k,h=img.height*k;
      g.drawImage(img,(S-w)/2,(S-h)/2,w,h);
      var out=c.toDataURL("image/webp",0.88);if(out.indexOf("image/webp")<0)out=c.toDataURL("image/png");
      draft.profile.logo=out;touch();render();
    };
    img.onerror=function(){setStatus("File itu bukan gambar yang bisa dibaca. Coba PNG atau JPG.","err");};
    img.src=r.result;
  };
  r.readAsDataURL(file);
}
function normalize(d){
  var o=clone(d);
  o.links=(o.links||[]).filter(function(l){return (l.title||"").trim()&&safeUrl(l.url);}).map(function(l){
    return {id:l.id||uid(),title:l.title.trim(),url:safeUrl(l.url),sub:(l.sub||"").trim(),icon:ICONS[l.icon]?l.icon:"link",featured:!!l.featured};
  });
  if(o.promo&&o.promo.btnUrl)o.promo.btnUrl=safeUrl(o.promo.btnUrl);
  return o;
}
function setStatus(t,k){status={text:t,kind:k||""};var s=document.querySelector(".ed-bar .status");if(s){s.textContent=t;s.className="status"+(k?" "+k:"");}}

/* ---------- save: regenerate the whole page from state ---------- */
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function buildDoc(s){
  var json=JSON.stringify(s).replace(/</g,"\\u003c");
  var sc="scr"+"ipt";
  return "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>"+RESET+"</style></head><body>"
    +"<title>"+esc(PAGE_TITLE)+"</title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n"
    +"<link rel=\"stylesheet\" href=\""+FONT_HREF.replace(/&/g,"&amp;")+"\">\n"
    +"<style id=\"bm-style\">"+styleText+"</style>\n"
    +"<div id=\"app\"></div>\n"
    +"<"+sc+" type=\"application/json\" id=\"bm-data\">"+json+"</"+sc+">\n"
    +"<"+sc+" id=\"bm-main\">"+scriptText+"</"+sc+">\n"
    +"</body></html>";
}
function save(){
  if(saving)return;
  var clean=normalize(draft);
  if(!clean.profile.name||!clean.profile.name.trim()){previewing=false;render();setStatus("Nama toko belum diisi.","err");ss(function(){document.getElementById("p-name").focus();});return;}
  if(localEdit&&!artifactNs){downloadSite(clean);return;}
  if(!artifactNs)return;
  saving=true;setStatus("Menyimpan…");
  var b=document.getElementById("save-btn");if(b)b.disabled=true;
  ss(function(){sessionStorage.setItem(DRAFT_KEY,JSON.stringify(clean));});
  Promise.resolve().then(function(){return artifactNs.publish(buildDoc(clean));}).then(function(){
    ss(function(){sessionStorage.removeItem(DRAFT_KEY);});
    setStatus("Tersimpan. Halaman dimuat ulang…","ok");
  },function(err){
    saving=false;if(b)b.disabled=false;
    var c=err&&err.code;
    if(c==="conflict"){setStatus("Ada versi lebih baru dari tempat lain. Halaman dimuat ulang; perubahanmu disimpan sebagai draf.","err");return;}
    ss(function(){sessionStorage.removeItem(DRAFT_KEY);});
    if(c==="not_writer"||c==="not_granted"||c==="consent_required"||c==="capability_disabled"||c==="capability_removed"||c==="not_declared"){canEdit=false;setStatus("Akun ini hanya bisa melihat halaman, tidak bisa menyimpan perubahan.","err");}
    else if(c==="too_large")setStatus("Halaman terlalu besar. Pakai logo dengan ukuran file lebih kecil.","err");
    else if(c==="rate_limited")setStatus("Terlalu sering menyimpan. Tunggu sebentar lalu tekan Simpan lagi.","err");
    else setStatus("Gagal menyimpan karena gangguan server. Tekan Simpan sekali lagi.","err");
  });
}

function embers(){
  var rm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches; if(rm)return;
  var c=document.createElement("canvas");c.className="embers";c.setAttribute("aria-hidden","true");
  document.body.insertBefore(c,document.body.firstChild);
  var g=c.getContext("2d"),W=0,H=0,P=[],N=40,run=true;
  function size(){var d=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0);N=Math.round(Math.max(24,Math.min(70,W*H/15000)));}
  function mk(x,y,b){return {x:x==null?Math.random()*W:x,y:y==null?H+10:y,vx:(Math.random()-.5)*(b?5:.5),vy:b?-(1+Math.random()*3.5):-(.35+Math.random()*1),
    r:b?1.2+Math.random()*2.4:.6+Math.random()*2.1,t:0,m:b?45+Math.random()*35:260+Math.random()*320,h:8+Math.random()*34,s:Math.random()*99,b:b};}
  size();for(var i=0;i<N;i++){var q=mk();q.y=Math.random()*H;q.t=Math.random()*q.m;P.push(q);}
  addEventListener("resize",size);
  document.addEventListener("visibilitychange",function(){run=!document.hidden;if(run)requestAnimationFrame(tick);});
  document.addEventListener("pointerdown",function(e){
    if(!e.target.closest||!e.target.closest(".link,.btn,.avatar,.btn2.primary,.fab"))return;
    for(var k=0;k<22;k++)P.push(mk(e.clientX,e.clientY,true));
  },{passive:true});
  function tick(){
    if(!run)return;
    g.clearRect(0,0,W,H);
    var alive=0;
    for(var i=P.length-1;i>=0;i--){var p=P[i];p.t++;
      p.x+=p.vx+Math.sin((p.t+p.s)/28)*.35;p.y+=p.vy;if(p.b){p.vx*=.96;p.vy*=.97;}
      if(p.t>p.m||p.y<-20){if(p.b){P.splice(i,1);continue;}P[i]=mk();continue;}
      if(!p.b)alive++;
      var a=Math.sin(Math.PI*p.t/p.m);
      g.fillStyle="hsla("+p.h+",95%,55%,"+(a*.16)+")";g.beginPath();g.arc(p.x,p.y,p.r*3.2,0,6.283);g.fill();

    }
    while(alive<N){P.push(mk());alive++;}
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
embers();

function render(){
  if(mode==="edit"&&draft&&previewing){renderPreview();return;}
  if(mode==="edit"&&draft)renderEditor(); else renderView(state);
}

}

/* ---------- website biasa: buat file baru untuk diupload ---------- */
function buildStandalone(s){
  var json=JSON.stringify(s).replace(/</g,"\\u003c");
  var sc="scr"+"ipt", p=s.profile||{};
  var desc=(p.bio||p.tagline||"").slice(0,160);
  return "<!doctype html>\n<html lang=\"id\">\n<head>\n<meta charset=\"utf-8\">\n"
    +"<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n"
    +"<title>"+esc((p.name||"")+(p.tagline?" · "+p.tagline:""))+"</title>\n"
    +"<meta name=\"description\" content=\""+esc(desc)+"\">\n"
    +"<meta property=\"og:title\" content=\""+esc(p.name||"")+"\">\n"
    +"<meta property=\"og:description\" content=\""+esc(desc)+"\">\n"
    +"<meta name=\"theme-color\" content=\"#F57A1C\">\n"
    +(p.logo?"<link rel=\"icon\" href=\""+esc(p.logo)+"\">\n":"")
    +"<link rel=\"stylesheet\" href=\""+FONT_HREF.replace(/&/g,"&amp;")+"\">\n"
    +"<style>"+RESET+"</style>\n"
    +"<style id=\"bm-style\">"+styleText+"</style>\n</head>\n<body>\n<div id=\"app\"></div>\n"
    +"<"+sc+" type=\"application/json\" id=\"bm-data\">"+json+"</"+sc+">\n"
    +"<"+sc+" id=\"bm-main\">"+scriptText+"</"+sc+">\n</body>\n</html>\n";
}
function downloadSite(clean){
  try{
    var blob=new Blob([buildStandalone(clean)],{type:"text/html"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="index.html";
    document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},2000);
    setStatus("File index.html sudah didownload. Buka repo GitHub kamu, klik Add file lalu Upload files, pilih file itu, lalu Commit changes. Website berubah dalam 1–2 menit.","ok");
  }catch(e){setStatus("File gagal dibuat di browser ini. Coba pakai Chrome terbaru.","err");}
}
render();
